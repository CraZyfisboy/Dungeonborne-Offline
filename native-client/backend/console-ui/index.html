<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-key" content="__LOCAL_KEY__"><title>Dungeonborne 本地控制台</title><link rel="stylesheet" href="/console.css"><script src="/console.js" defer></script></head>
<body><header><div><h1>Dungeonborne · 本地控制台</h1><p>掉落设置保存后，下次启动游戏时应用。地图原有的三个难度会自动使用对应配置。</p></div><span id="connection">正在读取存档…</span></header>
<section class="global"><div><span>当前金币</span><strong id="gold">—</strong></div><div><label for="amount">增加金币</label><div class="inline"><input id="amount" type="number" min="1" max="999999999" value="10000"><button id="add-gold">写入存档</button></div></div><div><label for="multiplier">全局掉落倍率</label><select id="multiplier"></select><small>保留基础概率，增加掉落判定次数。</small></div></section>
<div id="message" role="status" aria-live="polite"></div>
<main><aside><h2>掉落来源</h2><input id="source-search" type="search" placeholder="搜索怪物、宝箱或编号" aria-label="搜索掉落来源"><select id="category"><option value="monster">怪物</option><option value="chest">宝箱与容器</option><option value="all">全部来源</option></select><div id="sources"></div></aside>
<article><div class="editor-title"><div><h2 id="source-title">请选择掉落来源</h2><small id="source-info"></small></div><button id="save">保存当前配置</button></div><nav id="difficulties" aria-label="原地图难度"><button data-difficulty="1">原地图难度 1</button><button data-difficulty="2">原地图难度 2</button><button data-difficulty="3">原地图难度 3</button></nav>
<div class="inline spread"><label><input type="checkbox" id="enabled">启用这个来源的掉落</label><button id="defaults" class="secondary">恢复本档预设</button></div>
<section><div class="inline spread"><h3>随机装备</h3><label><input type="checkbox" id="pool-enabled">启用随机装备池</label></div><div id="pool"><div class="controls"><label>每次掉落率 %<input id="pool-chance" type="number" min="0" max="100" step="0.01"></label><label>判定次数<input id="pool-rolls" type="number" min="1" max="10" step="1"></label></div><p id="effective" class="muted"></p><p class="muted">装备掉落成功后，按下面的概率选择品质，再从该品质的装备范围中随机选择。</p><div id="qualities"></div><p id="quality-total"></p></div></section>
<section><div class="inline spread"><h3>指定物品或装备</h3><button id="add-item" class="secondary">添加指定掉落</button></div><p class="muted">每一行独立判定。药水、材料和指定装备都可以设置，不占用上面的随机装备判定。</p><div id="direct-items"></div></section>
<details><summary>额外按品质独立掉落</summary><p class="muted">需要某种品质额外掉落时，在这里添加；与随机装备池和指定物品分别判定。</p><div id="bonus-qualities"></div><button id="add-bonus" class="secondary">添加品质掉落</button></details>
<footer>这些是可修改的本地掉落规则。预设不是原服务器公布的掉率。召唤物默认不掉落。</footer></article></main>
<dialog id="picker"><div class="inline spread"><h2 id="picker-title">选择物品</h2><button id="picker-close" class="secondary">取消</button></div><input id="item-search" type="search" placeholder="搜索原版物品名称或编号"><p id="picker-help" class="muted"></p><div id="picker-items"></div><div class="inline spread"><button id="picker-clear" class="secondary">清空选择</button><button id="picker-accept">确定</button></div></dialog>
</body></html>
